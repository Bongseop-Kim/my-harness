# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json
sources:
  skills: ~/.config/skillshare/skills
  agents: ~/.config/skillshare/agents
extras_source: ~/.config/skillshare/extras
git_root: root
mode: merge
preserve_tilde_on_save: true
targets:
  claude:
    skills:
      path: ~/.claude/skills
  codex:
    skills:
      path: ~/.codex/skills
ignore:
  - '**/.DS_Store'
  - '**/.git/**'
extras:
  - name: nvim
    targets:
      - path: ~/.config/nvim
  - name: yazi
    targets:
      - path: ~/.config/yazi
  - name: ghostty
    targets:
      - path: ~/.config/ghostty
  - name: hooks
    targets:
      - path: ~/.codex/hooks
  - name: zsh-functions
    targets:
      - path: ~/.config/zsh-functions
audit:
  block_threshold: CRITICAL
